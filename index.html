<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--APP-->
<title>Room Layout Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen drafting table. Plan canvas on the left, a tool panel on the right
   (a bottom sheet on phones). Measuring-tape yellow marks every measurement. */
:root {
  --paper: #eef1ee;
  --panel: #f8faf8;
  --raised: #ffffff;
  --ink: #1d2628;
  --ink-2: #5a696b;
  --line: #d3dbd8;
  --tape: #f2b705;
  --tape-ink: #362900;
  --sel: #0d7480;
  --sel-soft: rgba(13,116,128,.12);
  --warn: #be3a26;
  --floor: #fbfcfa;
  --wall: #263134;
  --grid: #e6ebe8;
  --grid-strong: #d2dad6;
  --f0: #d9e6ef; --f1: #e9dfcc; --f2: #dbe8d6; --f3: #ecdbe0; --f4: #e2def0; --f5: #d8e7e5;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13191b; --panel: #192124; --raised: #20292c; --ink: #e2eae7; --ink-2: #95a5a6;
    --line: #2c383b; --tape: #f5c02a; --tape-ink: #2a2000; --sel: #45c1cc; --sel-soft: rgba(69,193,204,.16);
    --warn: #ff7c64; --floor: #1d272a; --wall: #cdd8d5; --grid: #222d30; --grid-strong: #2c393c;
    --f0: #2a3a46; --f1: #42392a; --f2: #2d3f2b; --f3: #45313a; --f4: #36324a; --f5: #27403e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13191b; --panel: #192124; --raised: #20292c; --ink: #e2eae7; --ink-2: #95a5a6;
  --line: #2c383b; --tape: #f5c02a; --tape-ink: #2a2000; --sel: #45c1cc; --sel-soft: rgba(69,193,204,.16);
  --warn: #ff7c64; --floor: #1d272a; --wall: #cdd8d5; --grid: #222d30; --grid-strong: #2c393c;
  --f0: #2a3a46; --f1: #42392a; --f2: #2d3f2b; --f3: #45313a; --f4: #36324a; --f5: #27403e;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-body); overflow: hidden; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--font-display); letter-spacing: -.01em; margin-right: auto; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--tape); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.tools { display: flex; gap: 6px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.tape { background: var(--tape); color: var(--tape-ink); border-color: var(--tape); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn.block { width: 100%; }

main { min-height: 0; display: grid; grid-template-columns: 1fr 360px; }
.stage { position: relative; min-width: 0; min-height: 0; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
.banner {
  position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px; border-radius: var(--r); background: var(--raised); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.08); max-width: 560px;
}
.banner p { margin: 0; flex: 1 1 220px; min-width: 0; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--tape); color: var(--tape-ink); font: 600 11px/1.6 var(--font-body); letter-spacing: .04em; text-transform: uppercase; }
.hud { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.hud .btn { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.scale { position: absolute; right: 14px; bottom: 16px; font: 500 11px var(--font-mono); color: var(--ink-2); text-align: right; pointer-events: none; }
.scale i { display: block; height: 6px; border: 1.5px solid var(--ink-2); border-top: 0; margin-top: 2px; margin-left: auto; }

/* Panel */
.panel { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 0 12px; border-bottom: 1px solid var(--line); align-items: flex-end; }
.tab { border: 0; background: none; padding: 8px 10px 9px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.sheet-toggle { margin-left: auto; display: none; }
.pbody { overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec h3 { margin: 0; font: 600 11px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card.sel { border-color: var(--sel); box-shadow: 0 0 0 3px var(--sel-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: 2fr repeat(3, minmax(0,1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); min-width: 0; }
input.in, select.in {
  width: 100%; min-height: 36px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-width: 0;
}
input.in.num { font-family: var(--font-mono); }
input.in:focus, select.in:focus { border-color: var(--sel); outline: none; box-shadow: 0 0 0 3px var(--sel-soft); }
.name-in { font: 600 16px var(--font-display) !important; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.warnline { color: var(--warn); font-weight: 500; font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.dists { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.dist { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--paper); font-size: 12px; }
.dist b { font: 500 13px var(--font-mono); }
.swatches { display: flex; gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--paper); }
.li[aria-current="true"] { background: var(--sel-soft); }
.li .thumb { width: 36px; height: 36px; border-radius: 6px; flex: none; border: 1px solid var(--line); background-size: cover; background-position: center; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t span { font: 500 12px var(--font-mono); color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 5px 10px; font-size: 13px; }
.chip:hover { border-color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--sel); }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r); border: 1px solid var(--warn); }
details.presets summary { cursor: pointer; font-weight: 500; list-style: none; }
details.presets summary::-webkit-details-marker { display: none; }
.tip { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 0; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stat b { font: 500 15px var(--font-mono); }

/* Plan SVG */
.g-minor { stroke: var(--grid); }
.g-major { stroke: var(--grid-strong); }
.wall { fill: none; stroke: var(--wall); stroke-linejoin: miter; }
.floor { fill: var(--floor); }
.item rect.body { stroke: var(--ink); stroke-opacity: .7; }
.item.floorish rect.body { stroke-dasharray: 6 4; stroke-opacity: .5; }
.item.bad rect.body { stroke: var(--warn); stroke-opacity: 1; }
.item.on rect.body { stroke: var(--sel); stroke-opacity: 1; }
.iname { fill: var(--ink); font-family: var(--font-body); font-weight: 600; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.idim { fill: var(--ink-2); font-family: var(--font-mono); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.wlabel { fill: var(--ink-2); font-family: var(--font-mono); font-weight: 500; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.tape-line { stroke: var(--tape); }
.tape-box { fill: var(--tape); }
.tape-txt { fill: var(--tape-ink); font-family: var(--font-mono); font-weight: 500; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.rot-h { fill: var(--raised); stroke: var(--sel); cursor: grab; }
.rot-l { stroke: var(--sel); }
.vtx { fill: var(--raised); stroke: var(--sel); cursor: move; }
.mid { fill: var(--sel); fill-opacity: .25; stroke: var(--sel); cursor: copy; }
.op-gap { fill: var(--floor); }
.op-line { stroke: var(--wall); fill: none; }
.op-arc { stroke: var(--ink-2); fill: none; stroke-dasharray: 4 3; }
.op-win { stroke: var(--sel); }
.op.on .op-hit { fill: var(--sel-soft); stroke: var(--sel); }
.op-hit { fill: transparent; cursor: move; }

/* Photo measuring */
#wiz { position: fixed; inset: 0; z-index: 30; background: #0d1112; color: #e8eeec; display: grid; grid-template-rows: auto 1fr auto; }
.wtop { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: #161c1e; }
.wtop h2 { margin: 0; font: 700 16px var(--font-display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsteps { display: flex; gap: 4px; font-size: 12px; color: #9fb0ae; }
.wsteps span { padding: 2px 8px; border-radius: 99px; border: 1px solid #2f3a3c; }
.wsteps span.on { background: #f2b705; color: #2a2000; border-color: #f2b705; font-weight: 600; }
.wstage { position: relative; min-height: 0; overflow: hidden; }
#wcv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#loupe { position: absolute; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #f2b705; box-shadow: 0 6px 20px rgba(0,0,0,.5); pointer-events: none; top: 12px; left: 12px; background: #000; }
.wpick { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.wpick-in { max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
.wpick h3 { margin: 0; font: 700 24px/1.15 var(--font-display); text-wrap: balance; }
.wpick ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: #c4d0ce; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 100px; }
.wbar { background: #161c1e; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; }
.wbar .muted { color: #9fb0ae; }
.wbar input.in, .wbar select.in { background: #0d1112; border-color: #2f3a3c; color: #e8eeec; }
.wbar .btn { background: #20292c; border-color: #2f3a3c; color: #e8eeec; }
.wbar .btn.tape { background: #f2b705; color: #2a2000; border-color: #f2b705; }
.wbar .seg { background: #20292c; border-color: #2f3a3c; }
.wbar .seg button[aria-pressed="true"] { background: #e8eeec; color: #0d1112; }
.wbar .warnline { color: #ff8a73; }
.winstr { margin: 0; font-size: 14px; }
.wread { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 13px var(--font-mono); color: #f5c02a; }
.wiz-light .btn.primary { background: #e8eeec; color: #0d1112; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: var(--r); font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px);
}

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
  .banner p { font-size: 13px; }
  .panel.collapsed .pbody { display: none; }
  .sheet-toggle { display: inline-flex; }
  .tools .lbl { display: none; }
  .top { gap: 6px; }
  .brand { font-size: 15px; }
}
@media (max-width: 420px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid4 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid4 > :first-child { grid-column: 1 / -1; }
  .wsteps { display: none; }
  .tab { padding: 8px 7px 9px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!--/APP-->
</head>
<body>
<!--APPBODY-->
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#362900" stroke-width="2.2" stroke-linecap="round"><path d="M3 17h18M6 17v-4M10 17v-6M14 17v-4M18 17v-6"/></svg></span>
      Room Layout Studio
    </div>
    <div class="tools">
      <button class="btn icon" id="b-undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon" id="b-redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn tape" id="b-photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lbl">Measure from photo</span></button>
    </div>
  </header>
  <main>
    <div class="stage">
      <svg id="plan" aria-label="Floor plan" role="img"></svg>
      <div class="banner" id="banner" hidden>
        <span class="pill">Example</span>
        <p>This is a sample room. Measure your own from a photo, or enter its size in the Room tab.</p>
        <button class="btn sm tape" data-act="photo-room">Measure my room</button>
        <button class="btn sm" data-act="dismiss-banner">Hide</button>
      </div>
      <div class="hud">
        <button class="btn sm" id="b-fit">Fit room</button>
        <button class="btn sm" id="b-img">Save image</button>
        <button class="btn sm" id="b-rot" hidden>Rotate 90°</button>
      </div>
      <div class="scale" id="scale"></div>
    </div>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="furniture">Furniture</button>
        <button class="tab" role="tab" data-tab="room">Room</button>
        <button class="tab" role="tab" data-tab="layouts">Layouts</button>
        <button class="tab" role="tab" data-tab="project">Project</button>
        <button class="btn icon sm sheet-toggle" id="b-sheet" aria-label="Show or hide panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </main>
</div>

<div id="wiz" hidden>
  <div class="wtop">
    <button class="btn sm" data-w="close" style="background:#20292c;border-color:#2f3a3c;color:#e8eeec">Done</button>
    <h2 id="wtitle">Measure from a photo</h2>
    <div class="wsteps" id="wsteps"></div>
  </div>
  <div class="wstage" id="wstage">
    <canvas id="wcv"></canvas>
    <canvas id="loupe" width="264" height="264" hidden></canvas>
    <div class="wpick" id="wpick"></div>
  </div>
  <div class="wbar" id="wbar"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================================================================
   Room Layout Studio: measure a room and its furniture from photos, then try
   layouts on a scaled floor plan. All lengths are stored in cm.
   ================================================================ */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DEG = Math.PI / 180;

/* ---------- geometry ---------- */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }),
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,
  len: a => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  rot: (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a) }),
  mid: (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }),
};
function polyArea(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function pointInPoly(p, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];

  if (a === "undo-pt") { const s = setOf(activeKey()); s.pop(); if (activeKey() === "ref") computeH(); return afterPointsChange(); }
  if (a === "clear") { W.sets[W.tool] = []; return afterPointsChange(); }
  if (a === "swap") { W.ref.pts.push(W.ref.pts.shift()); computeH(); return afterPointsChange(); }
  if (a === "tool") { W.tool = b.dataset.t; return afterPointsChange(); }
  if (a === "next") {
    W.step = "measure";
    W.photo.ref = JSON.parse(JSON.stringify(W.ref));
    if (!S.photos.includes(W.photo)) S.photos.unshift(W.photo);
    W.fitted = false; save(); return wrender();
  }
  if (a === "use-room") return useRoom();
  if (a === "add-item") return addFromFloor();
  if (a === "save-face") return saveFace();
});
function keepRef() { if (W.photo) { W.photo.ref = JSON.parse(JSON.stringify(W.ref)); save(); } }

function useRoom() {
  let P = W.sets.room.map(toPlane);
  if (P.some(p => !p)) return toast("A corner is above the floor's horizon. Move it down onto the floor.");
  let square = W.square;
  if (P.length === 3) { const [A, B, C] = P; P.push({ x: A.x + C.x - B.x, y: A.y + C.y - B.y }); square = true; }
  else if (P.length === 4) { const ok = P.every((b, i) => { const a = P[(i + 3) % 4], c = P[(i + 1) % 4]; return Math.abs(Math.acos(clamp(V.dot(V.norm(V.sub(a, b)), V.norm(V.sub(c, b))), -1, 1)) / DEG - 90) < 12; }); square = square && ok; }
  else square = false;
  if (polyArea(P) < 0) P.reverse();
  const ang = Math.atan2(P[1].y - P[0].y, P[1].x - P[0].x);
  let R = P.map(p => V.rot(p, -ang)); const o = { ...R[0] };
  R = R.map(p => V.sub(p, o));
  const T = { a: ang, ox: o.x, oy: o.y };
  if (square) {
    const L = i => V.dist(R[i], R[(i + 1) % 4]), w = Math.round((L(0) + L(2)) / 2), h = Math.round((L(1) + L(3)) / 2);
    R = [{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }];
  } else {
    const mx = Math.min(...R.map(p => p.x)), my = Math.min(...R.map(p => p.y));
    R = R.map(p => roundPt({ x: p.x - mx, y: p.y - my })); T.ox += mx; T.oy += my;
  }
  if (V.len(V.sub(R[1], R[0])) < 50 || Math.abs(polyArea(R)) < 1e4) return toast("That room comes out smaller than 1 m². Check the reference size and the corners.");
  commit();
  const wasExample = S.isExample;
  if (wasExample) { const l = { id: uid(), name: "Layout 1", pos: {} }; S.items = []; S.layouts = [l]; S.current = l.id; S.isExample = false; }
  S.room.pts = R; S.openings = [];
  W.photo.roomT = T; keepRef();
  renderAll(); fit();
  toast(wasExample ? "Room set. The example furniture was removed." : "Room set from the photo");
  W.tool = "item"; afterPointsChange();
}
function planeToRoom(p, T) { const q = V.rot(p, -T.a); return { x: q.x - T.ox, y: q.y - T.oy }; }
function cropThumb(pts, extendUp) {
  try {
    let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    const w = x1 - x0; if (extendUp) y0 -= w * 0.7;
    const pad = Math.max(w, y1 - y0) * 0.08; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W.img.width, x1 + pad); y1 = Math.min(W.img.height, y1 + pad);
    const s = 96 / Math.max(x1 - x0, y1 - y0, 1), c = document.createElement("canvas"); c.width = Math.max(1, (x1 - x0) * s); c.height = Math.max(1, (y1 - y0) * s);
    c.getContext("2d").drawImage(W.img, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.75);
  } catch (e) { return null; }
}
function formLen(k) { const v = parseLen(W.form[k]); return isFinite(v) && v > 0 ? v : NaN; }
function addFromFloor() {
  const ip = W.sets.item, P = ip.map(toPlane);
  if (P.some(p => !p)) return toast("A point is above the floor's horizon. Move it onto the floor.");
  const w = formLen("w"), d = formLen("d"), h = formLen("h");
  if (!isFinite(w)) return toast("Width is missing. Tap the two front corners.");
  if (!isFinite(d)) return toast("Depth is missing. Tap a back corner or type the depth.");
  const e = V.norm(V.sub(P[1], P[0]));
  let center;
  if (P.length >= 3 && !W.edited.d) center = V.mid(P[0], P[2]);
  else {
    const mid = V.mid(ip[0], ip[1]), away = toPlane({ x: mid.x, y: mid.y - 40 }), m = V.mid(P[0], P[1]);
    let n = { x: -e.y, y: e.x }; if (away && V.dot(n, V.sub(away, m)) < 0) n = V.mul(n, -1);
    center = V.add(m, V.mul(n, d / 2));
  }
  let pos = null;
  if (W.photo.roomT) { const c = planeToRoom(center, W.photo.roomT); pos = { x: Math.round(c.x), y: Math.round(c.y), r: Math.round(normDeg(Math.atan2(e.y, e.x) / DEG - W.photo.roomT.a / DEG) * 10) / 10 }; }
  const name = W.form.name.trim() || "Furniture";
  const floor = /\brug|carpet|mat\b/i.test(name);
  addItem(name, Math.round(w), Math.round(d), isFinite(h) ? Math.round(h) : 0, floor, pos, cropThumb(ip, true));
  toast(`Added ${name}: ${fmt(w)} × ${fmt(d)}`);
  W.sets.item = []; W.form = { name: "", w: "", d: "", h: "" }; W.edited = {}; afterPointsChange();
}
function saveFace() {
  const w = formLen("w"), d = formLen("d"), h = formLen("h"), name = W.form.name.trim() || "Furniture";
  if (W.target) {
    const it = S.items.find(i => i.id === W.target);
    if (!it) return closeWizard();
    commit();
    if (isFinite(w)) it.w = Math.round(w); if (isFinite(d)) it.d = Math.round(d); if (isFinite(h)) it.h = Math.round(h);
    it.name = name; const th = cropThumb([...W.sets.width, ...W.sets.height], false); if (th && (W.sets.width.length || W.sets.height.length)) it.thumb = th;
    toast(`Updated ${name}`); closeWizard(); return;
  }
  if (!isFinite(w)) return toast("Width is missing. Measure it on the photo or type it.");
  if (!isFinite(d)) return toast("Depth is missing. Measure it from a side photo, or type it.");
  addItem(name, Math.round(w), Math.round(d), isFinite(h) ? Math.round(h) : 0, /\brug|carpet\b/i.test(name), null, cropThumb([...W.sets.width, ...W.sets.height], false));
  toast(`Added ${name}`);
  W.sets.width = []; W.sets.height = []; W.sets.depth = []; W.form = { name: "", w: "", d: "", h: "" }; W.edited = {}; W.tool = "width"; afterPointsChange();
}

/* ---------- start ---------- */
(async function init() {
  const saved = await idbGet("project");
  if (saved && saved.room && Array.isArray(saved.items)) S = Object.assign(blankProject(), saved);
  renderAll();
  requestAnimationFrame(fit);
  new ResizeObserver(() => renderPlan()).observe(document.querySelector(".stage"));
  getDownloads();
})();
</script>
